[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-ai-research"
version = "0.1.0"
description = "Modular research pipeline for medicine image understanding"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.26,<3.0",
    "opencv-python>=4.10,<5.0",
    "ultralytics>=8.3,<9.0",
]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
