[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicine-ai-research"
version = "0.1.0"
description = "Modular research pipeline for medicine image understanding"
requires-python = ">=3.10"
dependencies = [
]

[project.optional-dependencies]
ml = [
    "numpy>=1.26,<3.0",
    "opencv-python>=4.10,<5.0",
    "torch>=2.3,<3.0",
    "torchvision>=0.18,<1.0",
    "ultralytics>=8.3,<9.0",
]
[tool.setuptools.packages.find]
include = ["app*"]
